name: less
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: less
      POSTGRES_PASSWORD: less_local
      POSTGRES_DB: less
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U less -d less"]
      interval: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
volumes:
  postgres_data:
  redis_data:
